<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Lil Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ffb6c1;
            --pink-dark: #db7093;
            --bg-color: #fff0f5;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* Container chứa ảnh và game nằm ngang nhau */
        .content-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .photo-section {
            text-align: center;
        }

        .photo-frame {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.3);
            object-fit: cover;
            animation: bounce 2s infinite alternate;
        }

        /* Game Snake Section */
        .game-section {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid var(--pink-main);
        }

        canvas#snakeGame {
            background: #fffafa;
            display: block;
            border-radius: 10px;
        }

        .game-info {
            color: var(--pink-dark);
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--pink-dark);
            margin: 10px 0;
        }

        .visuals {
            display: flex;
            gap: 20px;
            font-size: 50px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        .heart {
            position: absolute;
            color: #ffb6c1;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        @media (max-width: 800px) {
            .content-row { gap: 20px; }
            .photo-frame { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="visuals">
            <span>💐</span>
            <span>🎂</span>
        </div>

        <div class="content-row">
            <!-- PHẦN ẢNH -->
            <div class="photo-section">
                <img src="anh-cua-toi.jpg" alt="My Princess" class="photo-frame">
            </div>

            <!-- PHẦN GAME -->
            <div class="game-section">
                <div class="game-info">
                    <span>Score: <span id="scoreVal">0</span></span>
                    <span>Snake Game 🐍</span>
                </div>
                <canvas id="snakeGame" width="300" height="300"></canvas>
                <p style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">Dùng các phím mũi tên để chơi!</p>
            </div>
        </div>

        <h1>Happy Birthday My Lil Princess</h1>
    </div>

    <script>
        // HIỆU ỨNG TIM RƠI
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['🌸','❤️','💕'][Math.floor(Math.random()*3)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-10%';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);

        // LOGIC GAME CON RẮN
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreVal");

        const box = 20;
        let snake = [{ x: 9 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 14 + 1) * box,
            y: Math.floor(Math.random() * 14 + 1) * box
        };
        let score = 0;
        let d;

        document.addEventListener("keydown", direction);

        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#db7093" : "#ffb6c1";
                ctx.strokeStyle = "white";
                ctx.beginPath();
                ctx.roundRect(snake[i].x, snake[i].y, box, box, 5);
                ctx.fill();
                ctx.stroke();
            }

            // Vẽ thức ăn (Trái tim)
            ctx.font = "16px serif";
            ctx.fillText("❤️", food.x, food.y + 15);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerHTML = score;
                food = {
                    x: Math.floor(Math.random() * 14 + 1) * box,
                    y: Math.floor(Math.random() * 14 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Xử lý thua game
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Điểm của công chúa là: " + score);
                location.reload(); // Chơi lại
            }

            snake.unshift(newHead);
        }

        let game = setInterval(draw, 150);
    </script>
</body>
</html>
