<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift for My Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ffb6c1;
            --pink-dark: #db7093;
            --bg-color: #fff0f5;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Phần quà ẩn đi lúc đầu */
        #birthday-content {
            display: none; /* Ẩn đi */
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: scaleUp 1s ease-out;
        }

        .content-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .photo-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.3);
            object-fit: cover;
            animation: bounce 2s infinite alternate;
        }

        /* Khu vực game */
        .game-container {
            text-align: center;
            transition: all 0.5s ease;
        }

        .game-section {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid var(--pink-main);
        }

        canvas#snakeGame {
            background: #fffafa;
            display: block;
            border-radius: 10px;
        }

        .game-info {
            color: var(--pink-dark);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--pink-dark);
            margin: 15px 0;
        }

        .visuals { font-size: 45px; margin-bottom: 10px; }

        @keyframes scaleUp {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        .heart {
            position: absolute;
            color: #ffb6c1;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        #game-hint {
            color: var(--pink-dark);
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Container chính -->
    <div id="main-wrapper">
        
        <!-- TRÒ CHƠI BAN ĐẦU -->
        <div class="game-container" id="game-box">
            <div class="game-info">Hãy ăn 5 trái tim để nhận quà nhé! ❤️</div>
            <div class="game-info">Điểm của em: <span id="scoreVal">0</span></div>
            <div class="game-section">
                <canvas id="snakeGame" width="300" height="300"></canvas>
            </div>
            <div id="game-hint">Sử dụng phím mũi tên để di chuyển 🐍</div>
        </div>

        <!-- PHẦN QUÀ (SẼ HIỆN SAU) -->
        <div id="birthday-content">
            <div class="visuals">
                <span>💐</span>
                <span>🎂</span>
            </div>
            <div class="content-row">
                <div class="photo-section">
                    <img src="anh-cua-toi.jpg" alt="My Princess" class="photo-frame">
                </div>
            </div>
            <h1>Happy Birthday My Lil Princess</h1>
        </div>

    </div>

    <script>
        // LOGIC GAME SNAKE
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreVal");
        const gameBox = document.getElementById("game-box");
        const bdayContent = document.getElementById("birthday-content");

        const box = 20; 
        let score = 0;
        let gameActive = true;
        let snake = [{ x: 8 * box, y: 8 * box }];
        let food = {
            x: Math.floor(Math.random() * 14 + 1) * box,
            y: Math.floor(Math.random() * 14 + 1) * box
        };
        let d = "RIGHT";

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            if(!gameActive) return;

            ctx.fillStyle = "#fffafa";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#db7093" : "#ffb6c1";
                ctx.fillRect(snake[i].x, snake[i].y, box - 2, box - 2); 
            }

            ctx.font = "18px Arial";
            ctx.fillText("❤️", food.x, food.y + 16);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerHTML = score;
                
                // KIỂM TRA ĐIỂM ĐỂ HIỆN QUÀ
                if(score === 5) {
                    unlockBirthday();
                }

                food = {
                    x: Math.floor(Math.random() * 14 + 1) * box,
                    y: Math.floor(Math.random() * 14 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || 
               snake.some((segment, index) => index !== 0 && segment.x === newHead.x && segment.y === newHead.y)) {
                if(score < 5) {
                    gameActive = false;
                    alert("Cố lên công chúa ơi, sắp được 5 điểm rồi!");
                    document.location.reload();
                }
            }
            snake.unshift(newHead);
        }

        function unlockBirthday() {
            gameActive = false;
            gameBox.style.display = "none"; // Ẩn game
            bdayContent.style.display = "flex"; // Hiện quà
            
            // Bắt đầu hiệu ứng tim rơi lãng mạn
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['🌸','❤️','💕','✨'][Math.floor(Math.random()*4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-10%';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        let gameInterval = setInterval(draw, 150);
    </script>
</body>
</html>
