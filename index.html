<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Lil Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff0f5; /* Hồng pastel cực nhạt */
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #db7093;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
            animation: fadeIn 2s ease-in;
        }

        .visuals {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            margin-bottom: 20px;
            animation: slideUp 1.5s ease-out;
        }

        /* Hiệu ứng cho hoa và bánh */
        .flower, .cake {
            font-size: 100px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .flower:hover, .cake:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng tim rơi lãng mạn */
        .heart {
            position: absolute;
            color: #ffb6c1;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="visuals">
            <div class="flower">💐</div>
            <div class="cake">🎂</div>
        </div>
        <h1>Happy Bỉthday My Lil Princess</h1>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🌸'; // Bạn có thể đổi thành '❤️' nếu muốn
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Tạo hiệu ứng rơi nhẹ nhàng ngay khi mở web
        setInterval(createHeart, 400);
    </script>
</body>
</html>
