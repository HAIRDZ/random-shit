<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Lil Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ffb6c1;
            --pink-dark: #db7093;
            --bg-color: #fff0f5;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .content-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .photo-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.3);
            object-fit: cover;
            animation: bounce 2s infinite alternate;
        }

        .game-section {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid var(--pink-main);
        }

        canvas#snakeGame {
            background: #fffafa;
            display: block;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .game-info {
            color: var(--pink-dark);
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--pink-dark);
            margin: 15px 0 0 0;
            text-align: center;
        }

        .visuals {
            display: flex;
            gap: 20px;
            font-size: 40px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        .heart {
            position: absolute;
            color: #ffb6c1;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="visuals">
            <span>💐</span>
            <span>🎂</span>
        </div>

        <div class="content-row">
            <div class="photo-section">
                <!-- Nhớ đổi tên file ảnh cho đúng nhé -->
                <img src="anh-cua-toi.jpg" alt="My Princess" class="photo-frame">
            </div>

            <div class="game-section">
                <div class="game-info">
                    <span>Điểm: <span id="scoreVal">0</span></span>
                    <span>Snake 🐍</span>
                </div>
                <canvas id="snakeGame" width="300" height="300"></canvas>
            </div>
        </div>

        <h1>Happy Birthday My Lil Princess</h1>
    </div>

    <script>
        // HIỆU ỨNG TIM RƠI
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['🌸','❤️','💕'][Math.floor(Math.random()*3)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-10%';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 400);

        // LOGIC GAME SNAKE
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreVal");

        const box = 20; 
        let score = 0;
        let gameActive = true;

        let snake = [{ x: 8 * box, y: 8 * box }];
        let food = {
            x: Math.floor(Math.random() * 14 + 1) * box,
            y: Math.floor(Math.random() * 14 + 1) * box
        };

        let d = "RIGHT";

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            if(!gameActive) return;

            ctx.fillStyle = "#fffafa";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ rắn
            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#db7093" : "#ffb6c1";
                ctx.fillRect(snake[i].x, snake[i].y, box - 2, box - 2); 
            }

            // Vẽ mồi ❤️
            ctx.font = "18px Arial";
            ctx.fillText("❤️", food.x, food.y + 16);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            // Ăn mồi
            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerHTML = score;
                food = {
                    x: Math.floor(Math.random() * 14 + 1) * box,
                    y: Math.floor(Math.random() * 14 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            // Kiểm tra va chạm
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || 
               snake.some((segment, index) => index !== 0 && segment.x === newHead.x && segment.y === newHead.y)) {
                gameActive = false;
                alert("Game Over! Điểm của công chúa là: " + score);
                document.location.reload();
            }

            snake.unshift(newHead);
        }

        setInterval(draw, 150);
    </script>
</body>
</html>s
