<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Bỉthday My Lil Princess</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff0f5; 
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        /* Khung ảnh ở giữa */
        .photo-frame {
            width: 200px;
            height: 200px;
            border-radius: 50%; /* Hình tròn */
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.3);
            object-fit: cover; /* Giúp ảnh không bị méo */
            animation: bounce 2s infinite alternate;
        }

        .visuals {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            animation: slideUp 1.5s ease-out;
        }

        .flower, .cake {
            font-size: 80px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #db7093;
            margin-top: 30px;
            animation: fadeIn 2s ease-in;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            color: #ffb6c1;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .visuals { gap: 10px; }
            .photo-frame { width: 150px; height: 150px; }
            .flower, .cake { font-size: 50px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="visuals">
            <div class="flower">💐</div>
            <!-- Thay 'anh-cua-toi.jpg' bằng tên file ảnh bạn đã upload -->
            <img src="anh-cua-toi.jpg" alt="My Princess" class="photo-frame">
            <div class="cake">🎂</div>
        </div>
        <h1>Happy Birthday My Lil Princess</h1>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['🌸','❤️','✨','💕'][Math.floor(Math.random()*4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-10%';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
